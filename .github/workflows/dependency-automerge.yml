name: Auto-merge dependency PRs

# Auto-approve and auto-merge Renovate PRs. Renovate's `platformAutomerge: true`
# alone is unreliable in repos with branch rulesets — this workflow provides the
# explicit review + auto-merge clicks. The PR author (renovate[bot]) is a different
# actor from the workflow runner (github-actions[bot]), so GitHub's "no self-approval"
# rule is satisfied.

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  renovate-automerge:
    if: >
      github.actor == 'renovate[bot]' &&
      github.event.pull_request.user.login == 'renovate[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      PR_URL: ${{ github.event.pull_request.html_url }}
    steps:
      - name: Approve non-major updates
        if: "!contains(github.event.pull_request.labels.*.name, 'major')"
        run: gh pr review --approve "$PR_URL"

      - name: Enable auto-merge (squash) for non-major updates
        if: "!contains(github.event.pull_request.labels.*.name, 'major')"
        run: gh pr merge --auto --squash "$PR_URL"

      - name: Disable auto-merge for major updates (safety net)
        if: "contains(github.event.pull_request.labels.*.name, 'major')"
        run: gh pr merge --disable-auto "$PR_URL"
