name: CI

on:
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# Least privilege by default; the coverage job opts up to pull-requests: write
# for its PR comment.
permissions:
  contents: read

jobs:
  lint:
    name: ESLint + Prettier
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run lint:lockfile
      - name: Validate renovate.json
        run: npx --yes --package renovate -- renovate-config-validator --strict

  type-check:
    name: TypeScript type-check
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - run: npm ci
      - run: npm run type-check
      - run: npm run type-check:examples

  build:
    name: Dual-publish build (tsup)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - run: npm ci
      - run: npm run build
      - name: Verify dual ESM + CJS output
        run: |
          test -s dist/index.js
          test -s dist/index.cjs
          test -s dist/index.d.ts
          test -s dist/index.d.cts
          node --input-type=module -e "import('./dist/index.js').then(m => { if (!m.slothConnect) process.exit(1); })"
          node -e "if (!require('./dist/index.cjs').slothConnect) process.exit(1)"

  coverage:
    name: Vitest Coverage
    if: >
      github.event.pull_request.user.login != 'renovate[bot]' &&
      github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - run: npm ci
      - run: npm run coverage
      - name: Report Coverage
        if: always()
        uses: davelosert/vitest-coverage-report-action@v2

  packaging:
    name: Packaging (publint + attw + size-limit)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs: build
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - run: npm ci
      - run: npm run build
      - name: Validate published shape (publint + attw)
        run: npm run lint:packaging
      - name: Enforce size budget
        run: npm run size

  security:
    name: npm audit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high

  pre-commit:
    name: pre-commit hooks
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14.4'
      - uses: pre-commit/action@v3.0.1

  ci-gate:
    needs: [lint, type-check, build, packaging, coverage, security, pre-commit]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check all jobs passed
        run: |
          if [[ "${{ contains(needs.*.result, 'failure') }}" == "true" ]]; then
            echo "One or more jobs failed"
            exit 1
          fi
          if [[ "${{ contains(needs.*.result, 'cancelled') }}" == "true" ]]; then
            echo "One or more jobs were cancelled"
            exit 1
          fi
          IS_BOT="${{ github.event.pull_request.user.login == 'renovate[bot]' || github.event.pull_request.user.login == 'dependabot[bot]' }}"
          if [[ "$IS_BOT" != "true" && "${{ contains(needs.*.result, 'skipped') }}" == "true" ]]; then
            echo "One or more jobs were skipped"
            exit 1
          fi
          echo "All jobs passed"
