name: Feature request
description: Propose a change to the API or behavior.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What use case isn't served well by the current API?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What change do you propose? Sketch the API if relevant.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: checkboxes
    id: wire-compat
    attributes:
      label: Wire-protocol impact
      description: This package is wire-compatible with the Sloth server. Breaking that compatibility is out of scope.
      options:
        - label: My proposal does not change the AMQP wire protocol (exchanges, routing keys, headers).
          required: true
