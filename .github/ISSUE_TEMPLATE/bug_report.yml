name: Bug report
description: Something doesn't work as documented.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file an issue. Please include enough detail that we can reproduce the problem.

        For security vulnerabilities, **do not** open a public issue — see [SECURITY.md](../../SECURITY.md).
  - type: input
    id: package-version
    attributes:
      label: Package version
      description: Output of `npm ls @rinaldolabs/sloth-amqp`
      placeholder: 0.1.0
    validations:
      required: true
  - type: input
    id: node-version
    attributes:
      label: Node version
      placeholder: 24.15.0
    validations:
      required: true
  - type: input
    id: amqplib-version
    attributes:
      label: amqplib version
      placeholder: 2.0.1
    validations:
      required: true
  - type: input
    id: sloth-server-version
    attributes:
      label: Sloth server version (if known)
      placeholder: amqp:0.0.10
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: A small code snippet (or repo link) that reproduces the problem.
      render: ts
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant log output
      render: shell
